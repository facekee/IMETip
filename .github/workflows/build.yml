name: build

# 推到 master / 提交 PR：构建 + 单元测试 + 上传产物
# 打 v* 标签：额外校验版本号、生成 SHA256、自动创建 GitHub Release
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 创建 Release 需要写权限；来自 fork 的 PR 会被 GitHub 自动降为只读
permissions:
  contents: write

# 同一分支/标签有新提交时，取消上一次还没跑完的任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 固定 CMake(≥3.21) 与 Ninja，避免依赖 runner 镜像里的版本
      - name: 准备 CMake 与 Ninja
        uses: lukka/get-cmake@latest

      - name: 配置 MSVC x64 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 计算版本号
        id: vars
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = 'dev-' + '${{ github.sha }}'.Substring(0, 7)
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "版本号：$version"

      - name: 配置（Ninja + Release）
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build

      - name: 单元测试
        run: ctest --test-dir build --output-on-failure

      # 防止改了代码却忘记同步 src/Version.h 就打标签
      - name: 校验版本号与标签一致
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expected = '${{ steps.vars.outputs.version }}'
          $actual = (Get-Item build/IMETip.exe).VersionInfo.FileVersion
          Write-Host "exe=$actual  tag=$expected"
          if ($actual -notlike "$expected.*") {
            throw "版本不一致：src/Version.h 是 $actual，标签是 v$expected"
          }

      - name: 整理产物（改名 + SHA256）
        shell: pwsh
        run: |
          $v = '${{ steps.vars.outputs.version }}'
          $exe = "IMETip-$v-x64.exe"
          Copy-Item build/IMETip.exe $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File "$exe.sha256" -Encoding ascii
          Get-ChildItem "IMETip-$v-x64.exe*" | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: IMETip-${{ steps.vars.outputs.version }}-x64
          path: |
            IMETip-${{ steps.vars.outputs.version }}-x64.exe
            IMETip-${{ steps.vars.outputs.version }}-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 生成 Release 说明
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = '${{ steps.vars.outputs.version }}'
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^## \[$([regex]::Escape($v))\][^\r\n]*\r?\n(.*?)(?=^## |\z)"
          $match = [regex]::Match($text, $pattern)
          if ($match.Success) {
            $match.Groups[1].Value.Trim() | Out-File release-notes.md -Encoding utf8
            Write-Host "使用 CHANGELOG 中 $v 的章节作为说明"
          } else {
            "对应 $v 的 CHANGELOG 章节未找到，详见仓库 CHANGELOG.md。" |
              Out-File release-notes.md -Encoding utf8
          }

      - name: 发布 GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: IMETip ${{ steps.vars.outputs.version }}
          body_path: release-notes.md
          files: |
            IMETip-${{ steps.vars.outputs.version }}-x64.exe
            IMETip-${{ steps.vars.outputs.version }}-x64.exe.sha256
          draft: false
          prerelease: false
